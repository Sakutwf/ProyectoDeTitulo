name: sistema-cruz-roja

x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-Sistema Cruz Roja}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-SistemaCruzRoja}
  DB_USERNAME: ${MYSQL_USER:-cruzroja}
  DB_PASSWORD: ${MYSQL_PASSWORD}
  DB_CHARSET: utf8mb4
  DB_COLLATION: utf8mb4_unicode_ci
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-notificaciones@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sistema Cruz Roja}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,127.0.0.1}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-SistemaCruzRoja}
      MYSQL_USER: ${MYSQL_USER:-cruzroja}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/backend/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    environment: *laravel-env
    init: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/backend/storage

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${VUE_APP_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - backend_storage:/var/www/backend/storage:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  backend_storage:
